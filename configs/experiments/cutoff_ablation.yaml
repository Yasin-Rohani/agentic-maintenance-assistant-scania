# Cutoff-time shortcut ablation (Priority-0 temporal validity experiment).
# All paths are relative to the repository root.

data:
  fit: data/processed/train_random_model_fit.parquet
  calibration: data/processed/train_random_calibration.parquet
  validation: data/processed/validation_temporal_features.parquet

output_dir: reports/experiments/cutoff_ablation

# Columns that are never model inputs.
excluded_columns: [vehicle_id, class_label, binary_label]

# Explicit time / observation-duration proxies.
time_columns: [cutoff_time, num_readouts]

categorical_columns: [Spec_0, Spec_1, Spec_2, Spec_3, Spec_4, Spec_5, Spec_6, Spec_7]

# Arms of the ablation.
#   features: all | no_cutoff | no_time | time_only | spec_only
#   reweight: re-weight training snapshots so their cutoff_time
#             distribution matches Validation (uses Validation cutoff
#             times only, never Validation labels).
arms:
  - {name: A_full,              features: all,       reweight: false}
  - {name: B_no_cutoff,         features: no_cutoff, reweight: false}
  - {name: C_no_time,           features: no_time,   reweight: false}
  - {name: D_time_only,         features: time_only, reweight: false}
  - {name: E_spec_only,         features: spec_only, reweight: false}
  - {name: F_full_reweighted,   features: all,       reweight: true}
  - {name: G_no_time_reweighted, features: no_time,  reweight: true}

reweighting:
  n_bins: 20          # quantile bins on cutoff_time
  clip: [0.1, 10.0]   # clip density ratios

model:                # identical to train_multiclass_lightgbm.py
  n_estimators: 300
  learning_rate: 0.05
  num_leaves: 31
  max_depth: -1
  min_child_samples: 50
  reg_lambda: 1.0
  random_state: 42
  n_jobs: 4          # lower to 2 if the laptop becomes unresponsive

# 8 GB RAM settings.
# force_col_wise gives identical trees with lower peak memory.
lightgbm_memory:
  force_col_wise: true

memory:
  # Set to e.g. 0.6 ONLY if the run crashes with MemoryError.
  # Any value < 1.0 must be reported in run_info / the paper.
  fit_vehicle_fraction: 1.0

calibration_methods: [uncalibrated, sigmoid, isotonic]
capacity_fractions: [0.10, 0.30]

bootstrap:
  n_resamples: 1000
  calibration: sigmoid     # probabilities used for the paired bootstrap
  reference_arm: A_full
  random_state: 0

duration_probe:
  enabled: true            # can non-time features predict cutoff_time?
  n_estimators: 200

top_importances: 25
