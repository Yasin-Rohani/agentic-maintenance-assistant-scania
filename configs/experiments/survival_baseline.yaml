# E03 — Discrete-time hazard baseline vs decorrelated classifier.
# All paths are relative to the repository root.

data:
  fit: data/processed/train_random_model_fit.parquet
  calibration: data/processed/train_random_calibration.parquet
  validation: data/processed/validation_temporal_features.parquet
  landmarks: data/processed/train_landmark_features.parquet   # build_landmark_features.py

output_dir: reports/experiments/survival_baseline

excluded_columns: [vehicle_id, class_label, binary_label, remaining_time, in_study_repair]
time_columns: [cutoff_time, num_readouts]
categorical_columns: [Spec_0, Spec_1, Spec_2, Spec_3, Spec_4, Spec_5, Spec_6, Spec_7]

# model: classifier | hazard
# weights: none | decorrelate_val   (decorrelate_val = E02 arm H, frozen)
arms:
  - {name: A_classifier, model: classifier, weights: none}
  - {name: H_classifier, model: classifier, weights: decorrelate_val}
  - {name: S_hazard,     model: hazard,     weights: none}
  - {name: SH_hazard,    model: hazard,     weights: decorrelate_val}

hazard:
  # Remaining-time intervals (a, b] -> classes 4, 3, 2, 1 (official SCANIA bins)
  intervals: [[0, 6], [6, 12], [12, 24], [24, 48]]

weighting:               # identical to E02
  n_bins: 20
  smoothing: 1.0
  clip: [0.1, 10.0]

split_seeds: [original, 1, 2]   # identical to E02
calibration_fraction: 0.20

model:                   # identical to E01/E02
  n_estimators: 300
  learning_rate: 0.05
  num_leaves: 31
  max_depth: -1
  min_child_samples: 50
  reg_lambda: 1.0
  random_state: 42
  n_jobs: 4

lightgbm_memory:
  force_col_wise: true

calibration_methods: [uncalibrated, sigmoid, isotonic]
capacity_fractions: [0.10, 0.30]

bootstrap:
  n_resamples: 1000
  calibration: sigmoid
  reference_arm: H_classifier    # differences are read as "arm minus H"
  random_state: 0
